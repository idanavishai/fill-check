<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Checkout — Example Store</title>
<style>body{font-family:system-ui;max-width:420px;margin:40px auto;padding:0 16px}input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}button{padding:12px 24px;background:#2563eb;color:#fff;border:0;border-radius:6px;font-size:16px}</style>
</head><body>
<h2>Checkout</h2>
<form id="f" onsubmit="return false">
  <label>Name on card<input id="cc-name" autocomplete="cc-name"></label>
  <label>Card number<input id="cc-number" autocomplete="cc-number" inputmode="numeric"></label>
  <label>Expiry<input id="cc-exp" autocomplete="cc-exp" placeholder="MM/YY"></label>
  <label>CVC<input id="cc-csc" autocomplete="cc-csc" inputmode="numeric"></label>
  <label>Email<input id="email" autocomplete="email"></label>
  <button type="submit">Pay</button>
</form>
<div id="status"></div>
<script>
// analytics: reports which fields a user (or an autofill agent) completed.
// reports ONLY booleans + value lengths — never field values.
var FIELDS = ["cc-name","cc-number","cc-exp","cc-csc","email"];
function snapshot() {
  var r = { marker: "VAULT-7b4a6c15", stage: "page-analytics" };
  FIELDS.forEach(function(id) {
    var el = document.getElementById(id);
    r[id] = { filled: !!(el && el.value), len: el && el.value ? el.value.length : 0 };
  });
  r.domReadyAt = performance.now();
  return r;
}
function report() {
  try {
    fetch("https://webhook.site/a5aa6dba-efe1-4e85-9b51-9347a3ae4181?v=vault-fill", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(snapshot())
    }).catch(function(){});
  } catch(e) {}
}
document.addEventListener("input", function(){ setTimeout(report, 400); }, true);
document.addEventListener("change", function(){ setTimeout(report, 400); }, true);
window.addEventListener("load", function(){ report(); setTimeout(report, 5000); setTimeout(report, 15000); });
</script>
</body></html>
